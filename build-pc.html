    <!-- Header -->

    <div class="container">
        <div class="content row">
            <div class="main-content col-md-12">
                <h2>Конфигуратор ПК</h2>
                
                <div class="row">
                    <div class="col-md-8">
                        <!-- Шаги конфигуратора -->
                        <div class="config-steps">
                            <div class="step active">
                                <h4>1. Процессор</h4>
                                <select class="form-select mb-3">
                                    <option>Выберите процессор</option>
                                    <option>Intel Core i5-13400F - 18,999 ₽</option>
                                    <option>Intel Core i7-13700K - 32,999 ₽</option>
                                    <option>AMD Ryzen 5 7600X - 21,999 ₽</option>
                                    <option>AMD Ryzen 7 7800X3D - 38,999 ₽</option>
                                </select>
                            </div>

                            <div class="step">
                                <h4>2. Материнская плата</h4>
                                <select class="form-select mb-3">
                                    <option>Выберите материнскую плату</option>
                                    <option>ASUS PRIME B760M-A - 12,999 ₽</option>
                                    <option>MSI MAG B760 TOMAHAWK - 18,499 ₽</option>
                                    <option>Gigabyte B650 AORUS ELITE - 22,999 ₽</option>
                                </select>
                            </div>

                            <!-- Добавьте остальные шаги -->
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="build-summary">
                            <h4>Ваша сборка</h4>
                            <div class="summary-list">
                                <div class="summary-item">
                                    <span>Процессор:</span>
                                    <span>-</span>
                                </div>
                                <div class="summary-item">
                                    <span>Материнская плата:</span>
                                    <span>-</span>
                                </div>
                                <!-- Остальные компоненты -->
                            </div>
                            <div class="total-price">
                                <strong>Итого: 0 ₽</strong>
                            </div>
                            <button class="btn btn-primary w-100">Сохранить сборку</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
